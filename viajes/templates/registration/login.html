<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar | Diario de Viajes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
    <main class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">
        <h1 class="text-2xl font-semibold text-slate-900">Ingresar a Diario de Viajes</h1>
        <p class="mt-2 text-slate-600">Usa tu cuenta autorizada para crear o administrar viajes.</p>
        {% if form.errors %}
        <p class="mt-4 rounded-lg bg-red-100 p-3 text-red-800" role="alert">Usuario o contraseña incorrectos.</p>
        {% endif %}
        <form class="mt-6 space-y-4" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700" for="id_username">Usuario</label>
                <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="id_username"
                    name="username" autocomplete="username" required autofocus>
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700" for="id_password">Contraseña</label>
                <input class="w-full rounded-lg border border-slate-300 px-3 py-2" id="id_password"
                    name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="w-full rounded-lg bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700"
                type="submit">Ingresar</button>
        </form>
        <a class="mt-5 inline-block text-sm text-blue-700 hover:underline" href="{% url 'lista_viajes' %}">Volver al listado</a>
    </main>
</body>
</html>
