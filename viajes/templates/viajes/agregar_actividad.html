{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar actividad | Diario de Viajes</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 font-['Inter'] text-slate-900">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4 sm:px-6">
            <a class="flex items-center gap-3" href="{% url 'editar_viaje' viaje.pk %}">
                <img alt="Logo de Diario de Viajes" class="h-8 w-auto rounded-md" src="{% static 'viajes/logo.svg' %}" />
                <span class="font-['Plus_Jakarta_Sans'] text-lg font-semibold text-slate-900">Diario de Viajes</span>
            </a>
            <a class="inline-flex items-center gap-1 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
                href="{% url 'editar_viaje' viaje.pk %}">
                <span class="material-symbols-outlined text-lg">arrow_back</span>
                Volver
            </a>
        </div>
    </header>

    <main class="mx-auto max-w-xl px-4 py-12 sm:px-6">
        <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <div class="mb-6">
                <p class="text-sm font-semibold uppercase tracking-wider text-blue-700">{{ viaje.titulo }}</p>
                <h1 class="mt-1 font-['Plus_Jakarta_Sans'] text-2xl font-bold text-slate-900">
                    {% if actividad %}Editar actividad{% else %}Agregar actividad{% endif %}
                </h1>
            </div>

            <form action="{% if actividad %}{% url 'editar_actividad' viaje.pk actividad.pk %}{% else %}{% url 'agregar_actividad' viaje.pk %}{% endif %}" class="grid gap-5" method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}
                <div class="rounded-lg bg-red-50 p-3 text-sm text-red-800" role="alert">{{ form.non_field_errors }}</div>
                {% endif %}

                <label class="grid gap-1.5 text-sm font-medium text-slate-700" for="{{ form.nombre.id_for_label }}">
                    Actividad
                    {{ form.nombre }}
                    {% if form.nombre.errors %}<span class="text-sm font-normal text-red-700" role="alert">{{ form.nombre.errors }}</span>{% endif %}
                </label>

                <label class="grid gap-1.5 text-sm font-medium text-slate-700" for="{{ form.fecha.id_for_label }}">
                    Fecha
                    {{ form.fecha }}
                    {% if form.fecha.errors %}<span class="text-sm font-normal text-red-700" role="alert">{{ form.fecha.errors }}</span>{% endif %}
                </label>

                <label class="grid gap-1.5 text-sm font-medium text-slate-700" for="{{ form.costo.id_for_label }}">
                    Monto gastado (CLP)
                    {{ form.costo }}
                    {% if form.costo.errors %}<span class="text-sm font-normal text-red-700" role="alert">{{ form.costo.errors }}</span>{% endif %}
                </label>

                <button class="mt-1 inline-flex items-center justify-center gap-2 rounded-lg bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50"
                    type="submit">
                    <span class="material-symbols-outlined text-lg">save</span>
                    {% if actividad %}Guardar cambios{% else %}Guardar actividad{% endif %}
                </button>
            </form>
        </section>
    </main>
</body>
</html>
